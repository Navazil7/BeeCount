name: Generate fixed keystore (one-time)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate fixed release keystore
        run: |
          set -e
          keytool -genkeypair -noprompt \
            -keystore ci-debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname "CN=CI, OU=CI, O=CI, L=Mountain View, S=CA, C=US" \
            -validity 10000 -keyalg RSA -keysize 2048
          echo "=== keystore info ==="
          keytool -list -v -keystore ci-debug.keystore -storepass android | grep -E "Alias|SHA256|Valid" | head -6
          ls -la ci-debug.keystore

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug-keystore
          path: ci-debug.keystore
          if-no-files-found: error
