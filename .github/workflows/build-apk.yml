name: Build APK (fork)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.27.3"

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Build runner (Drift codegen, 必须)
        run: dart run build_runner build --delete-conflicting-outputs

      # 注意：本项目 android/app/build.gradle 默认开 splits.abi
      # 且未指定 --flavor 时默认落到 dev 风味(applicationId 带 .dev 后缀)。
      # 所以这里显式指定 prod，并且不要传 --target-platform（会与 splits 冲突，
      # 导致 Gradle 产出的文件名与 Flutter 期望的不一致 → "failed to produce an .apk file"）。
      - name: Build APK (prod, release)
        run: flutter build apk --release --flavor prod

      - name: Locate & collect APKs
        run: |
          set -e
          echo "=== 构建产物清单 ==="
          find build/app/outputs -name "*.apk" -printf "%p  (%s bytes)\n" || true
          mkdir -p out
          # 优先取 arm64 拆分产物，其次取 universal，最后兜底任意 apk
          A64=$(find build/app/outputs -name "*arm64-v8a*release*.apk" | head -1)
          UNI=$(find build/app/outputs -name "*universal*release*.apk" | head -1)
          ANY=$(find build/app/outputs -name "*.apk" | head -1)
          SRC="${A64:-${UNI:-$ANY}}"
          if [ -z "$SRC" ]; then echo "❌ 没有找到任何 APK"; exit 1; fi
          echo "选中: $SRC"
          cp "$SRC" "out/beecount-fork-${GITHUB_SHA::7}-$(basename "$SRC")"
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beecount-fork-apk
          path: out/*.apk
          if-no-files-found: error
